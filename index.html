<!DOCTYPE html>
<html>
<head>
    <style>
        .flex-container {
            display: flex;
            justify-content: left;
            background-color: rgb(0, 0, 0);
            padding: 10px;
        }

        .flex-box-items{
            width: 100px;
            height: 50px;
            background-color: rgb(255, 255, 255);
            border: 2px solid rgb(60, 43, 0);
            text-align: center;
        }

        .flex-box-bucket {
            width: 100px;
            height: 50px;
            background-color: rgb(108, 159, 225);
            border: 2px solid rgb(98, 98, 98);
            text-align: center;
        }

        .center {
            display: block;
            margin-left: auto;
            margin-right: auto;
            width: 25%;
        }
    </style>
    <script>
        function resetBoxes() {
            document.getElementById("bucket0").innerHTML = '<div class="flex-box-bucket"><p>0</p></div>';
            document.getElementById("bucket1").innerHTML = '<div class="flex-box-bucket"><p>1</p></div>';
            document.getElementById("bucket2").innerHTML = '<div class="flex-box-bucket"><p>2</p></div>';
            document.getElementById("bucket3").innerHTML = '<div class="flex-box-bucket"><p>3</p></div>';
            document.getElementById("bucket4").innerHTML = '<div class="flex-box-bucket"><p>4</p></div>';
        }
        function countTotal() {
            totalBucket0 = document.getElementById('bucket0').querySelectorAll('div').length;
            totalBucket1 = document.getElementById('bucket1').querySelectorAll('div').length;
            totalBucket2 = document.getElementById('bucket2').querySelectorAll('div').length;
            totalBucket3 = document.getElementById('bucket3').querySelectorAll('div').length;
            totalBucket4 = document.getElementById('bucket4').querySelectorAll('div').length;
            
            if(totalBucket0 == 16) {
                alert("Congratulations, you filled bucket 0 causing the worst case scenario for the hash table");
                resetBoxes();
            }
            else if (totalBucket1 == 16) {
                alert("Congratulations, you filled bucket 1 causing the worst case scenario for the hash table");
                resetBoxes();
            }
            else if(totalBucket2 == 16) {
                alert("Congratulations, you filled bucket 2 causing the worst case scenario for the hash table");
                resetBoxes();
            }
            else if(totalBucket3 == 16) {
                alert("Congratulations, you filled bucket 3 causing the worst case scenario for the hash table");
                resetBoxes();
            }
            else if(totalBucket4 == 16) {
                alert("Congratulations, you filled bucket 4 causing the worst case scenario for the hash table");
                resetBoxes();
            }
        }
        function addValue() {
            number = document.getElementById('fname').value;
            hashBucket = number % 5;

            // Default
            container = document.getElementById("bucket0");

            if (hashBucket == 1) {
                container = document.getElementById("bucket1");
            }
            else if (hashBucket == 2) {
                container = document.getElementById("bucket2");
            }
            else if (hashBucket == 3) {
                container = document.getElementById("bucket3");
            }
            else if (hashBucket == 4) {
                container = document.getElementById("bucket4");
            }

            const newDiv = document.createElement('div');
            newDiv.classList.add('flex-box-items');
            newDiv.textContent = number;
            container.appendChild(newDiv);

            countTotal();
        }
    </script>
</head>

<body>

<h1 style="text-align: center;">AC Attack Example: Hash Table DoS Attack</h1>

<form style="text-align: center; padding: 24px;" onsubmit="addValue(); return false;">
  <label for="fname">Enter input:</label>
  <input type="number" id="fname" name="fname" maxlength="2"><br><br>
  <input type="submit" value="Submit">
</form>

<p style="align-content: left;">Buckets</p>
<div class="flex-container" id="bucket0">
    <div class="flex-box-bucket"><p>0</p></div>
</div>

<div class="flex-container" id="bucket1">
    <div class="flex-box-bucket"><p>1</p></div>
</div>

<div class="flex-container" id="bucket2">
    <div class="flex-box-bucket"><p>2</p></div>
</div>

<div class="flex-container" id="bucket3">
    <div class="flex-box-bucket"><p>3</p></div>
</div>

<div class="flex-container" id="bucket4">
    <div class="flex-box-bucket"><p>4</p></div>
</div>

</body>
</html>
